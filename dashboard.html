<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#212121;background:#F5F5F5;line-height:1.6}
nav{background:#083042;padding:0 24px;height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:10px}
.container{max-width:980px;margin:0 auto;padding:32px 20px 60px}
.avatar{width:72px;height:72px;border-radius:50%;background:#323F45;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;flex-shrink:0}
.saludo-box{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.saludo-box h1{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:#212121}
.saludo-box p{color:#555;font-size:1.15rem;margin-top:4px}
.progreso-card{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.progreso-card h3{font-size:1.2rem;font-weight:700;margin-bottom:14px;color:#212121}
.pbar{background:#EEEEEE;border-radius:20px;height:18px;overflow:hidden}
.pfill{background:linear-gradient(90deg,#323F45,#00897B);height:100%;border-radius:20px;transition:width .6s ease;width:0%}
.siguiente-card{background:#323F45;border-radius:16px;padding:30px 28px;margin-bottom:32px;color:#fff}
.siguiente-card .tag{background:rgba(255,255,255,.15);display:inline-block;padding:5px 16px;border-radius:20px;font-size:1rem;font-weight:700;margin-bottom:14px;letter-spacing:.03em}
.siguiente-card h2{font-size:1.4rem;font-weight:800;margin-bottom:10px;line-height:1.3}
.siguiente-card p{font-size:1.15rem;opacity:.92;margin-bottom:20px;line-height:1.5}
.cta-btn{display:inline-block;background:#FFD740;color:#4527A0;font-weight:800;font-size:1.15rem;padding:15px 32px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;font-family:inherit}
h3.grid-title{font-size:1.3rem;font-weight:800;margin-bottom:16px;color:#212121}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-bottom:36px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:5px solid #ccc;display:flex;flex-direction:column}
.card .num{font-size:1rem;font-weight:700;color:#757575;margin-bottom:6px;letter-spacing:.03em}
.card h4{font-size:1.2rem;font-weight:800;margin-bottom:8px;line-height:1.3}
.card p.desc{color:#555;font-size:1.05rem;line-height:1.5;margin-bottom:16px;flex:1}
.pill{display:inline-block;font-size:.95rem;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px;width:fit-content}
.card .btns{display:flex;gap:8px;flex-wrap:wrap}
.card .btns a,.card .btns button{flex:1;text-align:center;padding:12px 10px;border-radius:10px;font-size:1.02rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;min-width:130px;font-family:inherit}
.salir-box{text-align:center;margin-top:12px}
.btn-salir{background:#fff;color:#C62828;border:2px solid #C62828;padding:16px 44px;border-radius:14px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:520px){.saludo-box{flex-direction:column;text-align:center}}
</style>

<body>
<nav>
  <div class="logo"><img src="logo.png" alt="" style="height:42px;width:42px;border-radius:50%;">Academia IA Generaciones</div>
  <button onclick="cerrarSesion()" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:1.05rem;cursor:pointer;font-family:inherit;">🚪 Salir</button>

<div class="container">
  <div class="saludo-box">
    <div class="avatar" id="avatar">A</div>
    <div>
      <h1 id="saludo">¡Hola de nuevo!</h1>
      <p>Este es tu panel de aprendizaje. Continúa donde lo dejaste.</p>
    </div>
  </div>

  <div class="progreso-card">
    <h3 id="progreso-txt">Has completado 0 de 6 módulos</h3>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
  </div>

  <div class="siguiente-card">
    <span class="tag">🎯 TU SIGUIENTE PASO</span>
    <h2 id="sig-titulo">Cargando...</h2>
    <p id="sig-desc"></p>
    <div id="sig-cta"></div>
  </div>

  <h3 class="grid-title">Tus módulos</h3>
  <div class="grid" id="modulos-grid"></div>

  <div class="salir-box">
    <button class="btn-salir" onclick="cerrarSesion()">🚪 Cerrar sesión</button>
  </div>
</div>

<script>
(function() {
  // ── Identidad del alumno ──────────────────────────────────────────────
  var nombre = sessionStorage.getItem('alumno_nombre');
  var email = sessionStorage.getItem('alumno_email') || localStorage.getItem('cuenta_acceso') || '';
  if (!nombre && !email) {
    window.location = 'login.html';
    return;
  }
  nombre = nombre || email.split('@')[0];
  document.getElementById('saludo').textContent = '¡Hola de nuevo, ' + nombre + '!';
  document.getElementById('avatar').textContent = nombre.charAt(0).toUpperCase();

  // ── Datos de los 6 módulos ────────────────────────────────────────────
  var MODULOS = [
    {n:1, icon:'🆓', titulo:'Descubriendo la Inteligencia Artificial', desc:'Qué es la IA y cómo ya está en tu vida diaria.', color:'#4527A0', gratis:true, archivo:'modulo1.html', cert:'certbox'},
    {n:2, icon:'💬', titulo:'Conversando con una IA', desc:'Aprende a chatear con ChatGPT, Gemini y Copilot.', color:'#00897B', precio:'$7 USD', archivo:'modulo2.html', cert:'certbox'},
    {n:3, icon:'🎨', titulo:'Creando Imágenes con IA', desc:'Genera imágenes y diseños con Canva IA.', color:'#C2185B', precio:'$9 USD', archivo:'modulo3.html', cert:'certbox'},
    {n:4, icon:'📅', titulo:'IA para la Vida Diaria', desc:'Organiza tu día a día con ayuda de la IA.', color:'#1565C0', precio:'$9 USD', archivo:'modulo4.html', cert:'certbox'},
    {n:5, icon:'✨', titulo:'IA para la Creatividad', desc:'Crea cuentos e historias con Gemini Storybook.', color:'#6A1B9A', precio:'$9 USD', archivo:'modulo5.html', cert:'certbox'},
    {n:6, icon:'🔒', titulo:'Seguridad y Uso Responsable', desc:'Detecta fraudes y usa la IA con confianza.', color:'#2E7D32', precio:'$9 USD', archivo:'modulo6.html', cert:'certbox-final'}
  ];

  function desbloqueado(n) {
    return n === 1 || !!localStorage.getItem('acceso_plan') || !!localStorage.getItem('acceso_modulo' + n);
  }
  function completado(n) {
    return !!localStorage.getItem('modulo' + n + '_completado');
  }
  function enProgreso(n) {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('autosave_modulo' + n + '_g') === 0) return true;
    }
    return false;
  }
  function estadoModulo(n) {
    if (completado(n)) return 'completado';
    if (!desbloqueado(n)) return 'bloqueado';
    return enProgreso(n) ? 'progreso' : 'disponible';
  }
  window.comprarModulo = function(n) {
    sessionStorage.setItem('ir_a', 'modulo' + n);
    window.location.href = 'Academia_AI.html#planes-pago';
  };

  // ── Progreso general ──────────────────────────────────────────────────
  var totalCompletados = 0;
  for (var i = 1; i <= 6; i++) { if (completado(i)) totalCompletados++; }
  document.getElementById('progreso-txt').textContent = 'Has completado ' + totalCompletados + ' de 6 módulos';
  document.getElementById('pfill').style.width = Math.round(totalCompletados / 6 * 100) + '%';

  // ── Tu siguiente paso ─────────────────────────────────────────────────
  var sigTitulo = document.getElementById('sig-titulo');
  var sigDesc = document.getElementById('sig-desc');
  var sigCta = document.getElementById('sig-cta');
  if (totalCompletados === 6) {
    sigTitulo.textContent = '🎉 ¡Completaste los 6 módulos!';
    sigDesc.textContent = 'Ya tienes tu Certificado Final del curso completo. Puedes repasar cualquier módulo cuando quieras.';
    sigCta.innerHTML = '<a href="modulo6.html#certbox-final" class="cta-btn">🏆 Ver mi Certificado Final</a>';
  } else {
    var siguiente = 1;
    for (var j = 1; j <= 6; j++) { if (!completado(j)) { siguiente = j; break; } }
    var m = MODULOS[siguiente - 1];
    var estado = estadoModulo(siguiente);
    if (estado === 'bloqueado') {
      sigTitulo.textContent = '🔒 Desbloquea el Módulo ' + siguiente + ': ' + m.titulo;
      sigDesc.textContent = 'Adquiere este módulo o el Plan Completo para seguir avanzando en tu curso.';
      sigCta.innerHTML = '<button class="cta-btn" onclick="comprarModulo(' + siguiente + ')">🔓 Desbloquear por ' + m.precio + '</button>';
    } else if (estado === 'progreso') {
      sigTitulo.textContent = '▶ Continúa el Módulo ' + siguiente + ': ' + m.titulo;
      sigDesc.textContent = 'Ya empezaste este módulo. Retómalo donde lo dejaste.';
      sigCta.innerHTML = '<a href="' + m.archivo + '" class="cta-btn">▶ Continuar donde lo dejaste</a>';
    } else {
      sigTitulo.textContent = (siguiente === 1 ? '🚀 Empieza tu curso: ' : '🚀 Empieza el Módulo ' + siguiente + ': ') + m.titulo;
      sigDesc.textContent = m.desc;
      sigCta.innerHTML = '<a href="' + m.archivo + '" class="cta-btn">🚀 Empezar</a>';
    }
  }

  // ── Grid de módulos ───────────────────────────────────────────────────
  var ESTADOS = {
    completado: {label:'✅ Completado', bg:'#E8F5E9', color:'#2E7D32'},
    progreso:   {label:'🟡 En progreso', bg:'#FFF8E1', color:'#F57F17'},
    disponible: {label:'🔵 Disponible', bg:'#E3F2FD', color:'#1565C0'},
    bloqueado:  {label:'🔒 Bloqueado', bg:'#F5F5F5', color:'#757575'}
  };
  var grid = document.getElementById('modulos-grid');
  MODULOS.forEach(function(m) {
    var estado = estadoModulo(m.n);
    var e = ESTADOS[estado];
    var botones = '';
    if (estado === 'completado') {
      botones = '<a href="' + m.archivo + '" style="background:#F5F5F5;color:#212121;">🔁 Repasar</a>'
        + '<a href="' + m.archivo + '#' + m.cert + '" style="background:' + m.color + ';color:#fff;">🏆 Certificado</a>';
    } else if (estado === 'progreso') {
      botones = '<a href="' + m.archivo + '" style="background:' + m.color + ';color:#fff;">▶ Continuar donde lo dejaste</a>';
    } else if (estado === 'disponible') {
      botones = '<a href="' + m.archivo + '" style="background:' + m.color + ';color:#fff;">🚀 Empezar</a>';
    } else {
      botones = '<button onclick="comprarModulo(' + m.n + ')" style="background:#757575;color:#fff;">🔒 Desbloquear ' + (m.precio || '') + '</button>';
    }
    var card = document.createElement('div');
    card.className = 'card';
    card.style.borderTopColor = m.color;
    card.innerHTML =
      '<span class="pill" style="background:' + e.bg + ';color:' + e.color + ';">' + e.label + '</span>'
      + '<div class="num">MÓDULO ' + m.n + (m.gratis ? ' · GRATIS' : '') + '</div>'
      + '<h4>' + m.icon + ' ' + m.titulo + '</h4>'
      + '<p class="desc">' + m.desc + '</p>'
      + '<div class="btns">' + botones + '</div>';
    grid.appendChild(card);
  });
})();

function cerrarSesion() {
  if (window.fbAuth) {
    window.fbAuth.signOut().then(function() {
      sessionStorage.clear();
      window.location.href = 'Academia_AI.html';
    });
  } else {
    sessionStorage.clear();
    window.location.href = 'Academia_AI.html';
  }
}
</script>
