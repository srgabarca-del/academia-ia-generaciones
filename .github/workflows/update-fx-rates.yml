name: Actualizar tipos de cambio

on:
  schedule:
    # Todos los lunes 13:00 UTC (~7:00 am hora de México, ~2:00 pm en España)
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-fx-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Actualizar FX_RATES en Academia_AI.html
        run: node .github/scripts/update-fx-rates.mjs

      - name: Hacer commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Academia_AI.html; then
            echo "Los tipos de cambio no cambiaron, no hay nada que subir."
          else
            git add Academia_AI.html
            git commit -m "Actualizar tipos de cambio de referencia (MXN/EUR) [automático]"
            git push
          fi
